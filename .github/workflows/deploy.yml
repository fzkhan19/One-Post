name: Auto Deploy to Oracle Cloud VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted  # Runs directly on the Oracle VPS — no SSH needed

    steps:
      - name: Pull latest code
        run: |
          cd /home/ubuntu/One-Post
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          export PATH=/usr/local/bin:/home/ubuntu/.bun/bin:$PATH
          cd /home/ubuntu/One-Post
          bun install

      - name: Build Next.js
        run: |
          export PATH=/usr/local/bin:/home/ubuntu/.bun/bin:$PATH
          cd /home/ubuntu/One-Post
          bun run build

      - name: Reload PM2
        run: |
          export PATH=/usr/local/bin:/home/ubuntu/.bun/bin:$PATH
          pm2 restart one-post
          pm2 list
